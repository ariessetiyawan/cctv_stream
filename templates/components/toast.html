<!-- ====== TOAST NOTIFICATIONS ====== -->

<!-- Toast Container -->
<div id="toastContainer" class="fixed bottom-6 right-6 z-[200] flex flex-col items-end gap-3 max-w-sm w-full pointer-events-none">
    
    <!-- Toast Success -->
    <div id="toastSuccess" class="toast-item pointer-events-auto hidden w-full transform transition-all duration-500 ease-out translate-x-full opacity-0">
        <div class="bg-[#0f2240] border border-emerald-500/30 rounded-2xl shadow-2xl shadow-emerald-500/10 backdrop-blur-xl p-4 flex items-start gap-3 relative overflow-hidden">
            <!-- Progress Bar -->
            <div class="absolute bottom-0 left-0 h-0.5 bg-emerald-500 rounded-full transition-all duration-1000" style="width: 100%;" id="toastSuccessProgress"></div>
            
            <!-- Icon -->
            <div class="flex-shrink-0 w-10 h-10 rounded-xl bg-emerald-500/20 flex items-center justify-center">
                <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            
            <!-- Content -->
            <div class="flex-1 min-w-0">
                <p class="text-white font-semibold text-sm" id="toastSuccessTitle">Berhasil!</p>
                <p class="text-blue-300/60 text-xs mt-0.5" id="toastSuccessMessage">Operasi berhasil dilakukan</p>
            </div>
            
            <!-- Close Button -->
            <button onclick="closeToast('success')" class="flex-shrink-0 text-blue-300/30 hover:text-white transition p-1 rounded-lg hover:bg-white/5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Toast Error -->
    <div id="toastError" class="toast-item pointer-events-auto hidden w-full transform transition-all duration-500 ease-out translate-x-full opacity-0">
        <div class="bg-[#0f2240] border border-red-500/30 rounded-2xl shadow-2xl shadow-red-500/10 backdrop-blur-xl p-4 flex items-start gap-3 relative overflow-hidden">
            <!-- Progress Bar -->
            <div class="absolute bottom-0 left-0 h-0.5 bg-red-500 rounded-full transition-all duration-1000" style="width: 100%;" id="toastErrorProgress"></div>
            
            <!-- Icon -->
            <div class="flex-shrink-0 w-10 h-10 rounded-xl bg-red-500/20 flex items-center justify-center">
                <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            
            <!-- Content -->
            <div class="flex-1 min-w-0">
                <p class="text-white font-semibold text-sm" id="toastErrorTitle">Gagal!</p>
                <p class="text-blue-300/60 text-xs mt-0.5" id="toastErrorMessage">Terjadi kesalahan pada sistem</p>
            </div>
            
            <!-- Close Button -->
            <button onclick="closeToast('error')" class="flex-shrink-0 text-blue-300/30 hover:text-white transition p-1 rounded-lg hover:bg-white/5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Toast Warning -->
    <div id="toastWarning" class="toast-item pointer-events-auto hidden w-full transform transition-all duration-500 ease-out translate-x-full opacity-0">
        <div class="bg-[#0f2240] border border-yellow-500/30 rounded-2xl shadow-2xl shadow-yellow-500/10 backdrop-blur-xl p-4 flex items-start gap-3 relative overflow-hidden">
            <!-- Progress Bar -->
            <div class="absolute bottom-0 left-0 h-0.5 bg-yellow-500 rounded-full transition-all duration-1000" style="width: 100%;" id="toastWarningProgress"></div>
            
            <!-- Icon -->
            <div class="flex-shrink-0 w-10 h-10 rounded-xl bg-yellow-500/20 flex items-center justify-center">
                <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            
            <!-- Content -->
            <div class="flex-1 min-w-0">
                <p class="text-white font-semibold text-sm" id="toastWarningTitle">Peringatan!</p>
                <p class="text-blue-300/60 text-xs mt-0.5" id="toastWarningMessage">Mohon periksa kembali input Anda</p>
            </div>
            
            <!-- Close Button -->
            <button onclick="closeToast('warning')" class="flex-shrink-0 text-blue-300/30 hover:text-white transition p-1 rounded-lg hover:bg-white/5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Toast Info -->
    <div id="toastInfo" class="toast-item pointer-events-auto hidden w-full transform transition-all duration-500 ease-out translate-x-full opacity-0">
        <div class="bg-[#0f2240] border border-blue-500/30 rounded-2xl shadow-2xl shadow-blue-500/10 backdrop-blur-xl p-4 flex items-start gap-3 relative overflow-hidden">
            <!-- Progress Bar -->
            <div class="absolute bottom-0 left-0 h-0.5 bg-blue-500 rounded-full transition-all duration-1000" style="width: 100%;" id="toastInfoProgress"></div>
            
            <!-- Icon -->
            <div class="flex-shrink-0 w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            
            <!-- Content -->
            <div class="flex-1 min-w-0">
                <p class="text-white font-semibold text-sm" id="toastInfoTitle">Informasi</p>
                <p class="text-blue-300/60 text-xs mt-0.5" id="toastInfoMessage">Informasi sistem terbaru</p>
            </div>
            
            <!-- Close Button -->
            <button onclick="closeToast('info')" class="flex-shrink-0 text-blue-300/30 hover:text-white transition p-1 rounded-lg hover:bg-white/5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>
</div>
