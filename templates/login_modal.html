<style>
    /* ===== HOURGLASS LOADING ANIMATION (Modal) ===== */
    @keyframes hourglassFlipModal {
        0%, 40%  { transform: rotate(0deg); }
        50%, 90% { transform: rotate(180deg); }
        100%     { transform: rotate(360deg); }
    }

    .hourglass-icon-modal {
        animation: hourglassFlipModal 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        transform-origin: 50% 50%;
        display: inline-block;
    }

    @keyframes sandGlowModal {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.55; }
    }
    .hourglass-icon-modal path {
        animation: sandGlowModal 1.6s ease-in-out infinite;
    }

    .login-btn-loading {
        pointer-events: none;
        opacity: 0.85;
    }
    .login-btn-loading .btn-text { visibility: hidden; }
    .login-btn-loading .btn-spinner {
        display: inline-flex !important;
        position: absolute;
        align-items: center;
        justify-content: center;
    }
</style>
<div id="loginModal" class="fixed inset-0 z-[100] flex items-center justify-center px-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="absolute inset-0 modal-backdrop" onclick="closeLoginModal()"></div>
    <div class="relative w-full max-w-md bg-[#0f2240] rounded-2xl shadow-2xl border border-blue-500/20 p-6 sm:p-8 transform transition-all duration-300 scale-95" id="loginModalCard">
        <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-blue-300/50 hover:text-white transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        <div class="text-center mb-6">
			<div class="w-20 h-20 rounded-2xl bg-white/5 border border-blue-500/20 flex items-center justify-center mx-auto overflow-hidden">
				<img src="{{ url_for('static', filename='img/logo-rsud.png') }}"
					 alt="Logo RSUD Jombang"
					 class="w-full h-full object-contain p-2" />
			</div>
			<h3 class="text-white text-2xl font-bold mt-3">RSUD Jombang</h3>
			<p class="text-blue-300/50 text-xs mt-0.5 uppercase tracking-widest font-medium">
				CCTV Stream Server
			</p>
			<p class="text-blue-300/60 text-sm mt-3">Masuk untuk melanjutkan</p>
		</div>
        <form class="space-y-4" id="loginForm" onsubmit="handleLogin(event)">
			<div>
				<label class="block text-blue-200/70 text-sm font-medium mb-1.5">Username / Email</label>
				<input type="text" id="loginEmail" placeholder="username atau email"
					   class="w-full bg-[#0a1628] border border-blue-500/20 rounded-xl px-4 py-3 text-white placeholder-blue-300/30 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition"
					   required autocomplete="username" />
			</div>
			<div>
				<label class="block text-blue-200/70 text-sm font-medium mb-1.5">Kata Sandi</label>
				<input type="password" id="loginPassword" placeholder="••••••••"
					   class="w-full bg-[#0a1628] border border-blue-500/20 rounded-xl px-4 py-3 text-white placeholder-blue-300/30 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition"
					   required />
			</div>
			<div class="flex items-center justify-between text-sm">
				<label class="flex items-center gap-2 text-blue-300/50">
					<input type="checkbox" class="accent-blue-600 w-4 h-4 rounded border-blue-500/30 bg-[#0a1628]" />
					<span>Ingat saya</span>
				</label>
				<a href="#" class="text-blue-400 hover:text-blue-300 transition">Lupa sandi?</a>
			</div>

			<!-- ====== TOMBOL LOGIN DENGAN HOURGLASS ====== -->
			<button type="submit"
					id="modalLoginSubmitBtn"
					class="relative w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-600/30 transition flex items-center justify-center gap-2">
				<span class="btn-text flex items-center justify-center gap-2">
					<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							  d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
					</svg>
					Masuk
				</span>
				<span class="btn-spinner hidden">
					<svg class="w-5 h-5 hourglass-icon-modal" viewBox="0 0 24 24" fill="none"
						 stroke="currentColor" stroke-width="2"
						 stroke-linecap="round" stroke-linejoin="round">
						<path d="M7 2h10" />
						<path d="M7 22h10" />
						<path d="M7 2v3c0 2 5 5 5 7s-5 5-5 7v3" />
						<path d="M17 2v3c0 2-5 5-5 7s5 5 5 7v3" />
					</svg>
					<span class="ml-2">Memproses...</span>
				</span>
			</button>
		</form>
		<div class="mt-4 p-3 rounded-lg bg-blue-500/10 border border-blue-500/20">
				<div class="flex items-start gap-2">
					<svg class="w-4 h-4 text-blue-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
					</svg>
					<p class="text-xs text-blue-200/80">
						Gunakan akun <strong class="text-blue-300">SIKAWAN</strong> RSUD Jombang
						untuk login. Hubungi IT jika akun Anda belum terdaftar.
					</p>
				</div>
			</div>
        <div class="flex items-center gap-3 my-5">
            <div class="flex-1 h-px bg-blue-500/10"></div>
            <span class="text-blue-300/30 text-xs font-medium uppercase tracking-wider">atau</span>
            <div class="flex-1 h-px bg-blue-500/10"></div>
        </div>
		
        <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 bg-white/5 hover:bg-white/10 border border-blue-500/20 hover:border-blue-500/40 text-white font-medium py-3 rounded-xl transition group">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Lanjutkan dengan Google
        </button>
        <p class="text-center text-blue-300/50 text-sm mt-5 hidden">
            Belum punya akun? <a href="#" class="text-blue-400 hover:text-blue-300 font-medium transition">Daftar sekarang</a>
        </p>
    </div>
</div>
